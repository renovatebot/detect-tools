name: Build

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

  push:
    branches:
      - main
      - next
      - maint/**

  merge_group:

  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry-Run'
        default: 'true'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch && !startsWith(github.ref_name, 'maint/') }}

env:
  # are we on a release branch?
  DO_REALEASE: ${{ github.ref_name == github.event.repository.default_branch || github.ref_name == 'next' || startsWith(github.ref_name, 'maint/')}}
  DRY_RUN: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # node and pnpm come from the setup action, so `mise exec` must not
      # install them again
      MISE_EXEC_AUTO_INSTALL: 'false'

    steps:
      - uses: containerbase/internal-tools/setup@2082203142ae62859ac4a86919258077c6460403 # v5.3.12
        with:
          save-cache: true

      - run: pnpm build

      - run: pnpm oxlint --format github

      - run: pnpm oxfmt

      - name: Install the workflow linters
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: jactionlint shellcheck zizmor

      - name: Check workflow files
        run: mise exec -- jactionlint --color

      - name: Run zizmor
        run: mise exec -- zizmor --format github .github/
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    strategy:
      matrix:
        os:
          - ubuntu
          - macos
          - windows
        node:
          - 24
        include:
          # too slow and too many tests to run them on all os
          - os: ubuntu
            node: 26

    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 30

    name: test-${{ matrix.os }}-${{ matrix.node }}

    permissions:
      id-token: write

    env:
      coverage: ${{ matrix.os == 'ubuntu' && matrix.node == 24 }}

    steps:
      - uses: containerbase/internal-tools/setup@2082203142ae62859ac4a86919258077c6460403 # v5.3.12
        with:
          save-cache: true
          node-version: ${{ matrix.node }}

      - name: Test
        run: pnpm test --coverage "${coverage}" --logHeapUsage
        shell: bash

      - name: Codecov test results
        if: github.event_name != 'merge_group' && !cancelled()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          report_type: test_results
          flags: node${{ matrix.node }}-${{ runner.os }}

      - name: Codecov coverage results
        if: github.event_name != 'merge_group' && env.coverage == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          flags: node${{ matrix.node }}-${{ runner.os }}

  # Catch-all required check for test matrix
  success:
    needs:
      - lint
      - test
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    if: always()
    steps:
      - name: Fail for failed or cancelled lint tests
        if: |
          needs.lint.result == 'failure' ||
          needs.lint.result == 'cancelled'
        run: exit 1

      - name: Fail for failed or cancelled test tests
        if: |
          needs.test.result == 'failure' ||
          needs.test.result == 'skipped'
        run: exit 1

  release:
    needs:
      - success

    if: github.repository == 'renovatebot/detect-tools' && github.event_name != 'pull_request'

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # semantic-release pushes with its own token
          fetch-depth: 0 # zero stands for full checkout, which is required for semantic-release
          filter: blob:none # we don't need all blobs, only the full tree
          show-progress: false

      - uses: containerbase/internal-tools/setup@2082203142ae62859ac4a86919258077c6460403 # v5.3.12
        with:
          checkout: false

      - name: Check dry run
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DRY_RUN_INPUT}" != "true" ]]; then
            echo "DRY_RUN=false" >> "$GITHUB_ENV"
          elif [[ "${DO_REALEASE}" == "true" ]]; then
            echo "DRY_RUN=false" >> "$GITHUB_ENV"
          fi
        env:
          DRY_RUN_INPUT: ${{ github.event.inputs.dryRun }}

      - run: pnpm build

      - name: semantic-release
        run: |
          pnpm semantic-release --dry-run "${DRY_RUN}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
